# ============================================================================
#  LAN FPS - server configuration
#
#  Edit this file, then run run-server.bat. Every value can also be passed on
#  the command line, e.g.:  java -jar server.jar --mode=TDM --botCount=6
# ============================================================================

# --- Network ----------------------------------------------------------------
# UDP port for ALL game traffic (input, snapshots, ping, discovery, lobby).
udpPort=7777

# Interface to bind. 0.0.0.0 means "all interfaces" and is what you want so the
# phones on the Wi-Fi can reach the PC. Do NOT put 192.168.1.25 here.
bindAddress=0.0.0.0

# Informational only: the IP printed in instructions and used as the default in
# the Android client's connect screen. The server always binds 0.0.0.0.
defaultServerIp=192.168.1.25

# Answer UDP broadcast discovery so phones can find the server automatically.
# Manual IP entry always works regardless of this setting.
enableDiscovery=true

# --- Match ------------------------------------------------------------------
# DM  = Deathmatch (free for all)
# TDM = Team Deathmatch (RED vs BLUE)
mode=DM

# Match length in seconds and the score needed to win early.
matchTimeSeconds=300
killLimit=20

# --- Players and bots -------------------------------------------------------
maxPlayers=8
botCount=4

# Bot skill: 0.0 = slow turning and sloppy aim, 1.0 = fast and accurate.
botDifficulty=0.55

# --- P0-3: connection flood protection --------------------------------------
# Max simultaneous active sessions from one source IP (2 phones behind one NAT
# is already rare; raising this lets a flood script take all the slots).
maxSessionsPerIp=2
# Max brand-new connections accepted per second, globally and per source IP.
maxConnectsPerSecond=5
maxConnectsPerIpPerSecond=2

# --- P0-2: reconnect --------------------------------------------------------
# How long a silent session is kept for a reconnect (via its resume token)
# before its entity and slot are finally reclaimed. 0 disables reconnect.
zombieTimeoutMs=30000

# --- P1-1: lag compensation -------------------------------------------------
# Rewind targets on a shot to where the shooter actually saw them (~90 ms + RTT/2,
# capped at 250 ms). Fixes "shot him point-blank and missed" on jittery Wi-Fi.
lagCompensation=true

# --- P1-2: delta compression -------------------------------------------------
# Send a FULL snapshot once a second and DELTAs (only changed entities) between,
# instead of a full snapshot 30x/s. Saves most of the snapshot bandwidth.
deltaCompression=true

# --- Presentation -----------------------------------------------------------
serverName=LAN FPS Server

# Map file. Looked up next to the jar first, then inside the jar.
arenaFile=arena01.json

# DEBUG | INFO | WARN | ERROR
logLevel=INFO

# Set >0 to run a headless simulation for N seconds and exit (smoke test).
selfTestSeconds=0
