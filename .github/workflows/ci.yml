name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Server + shared: no Android SDK needed, so this job is the fast gate.
  # ---------------------------------------------------------------------------
  server:
    name: Shared + server (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The Gradle wrapper must be executable. Git cannot carry the unix +x bit
      # through a zip extracted on Windows, so the committed mode can end up
      # 100644 and `./gradlew` fails with "Permission denied" (exit 126) on the
      # Linux runner. Re-assert it explicitly so CI never depends on how the
      # repo was checked out.
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run the shared + server test suites
        run: ./gradlew :shared:test :server:test --console=plain --stacktrace

      - name: Build the Windows server bundle
        run: ./gradlew :server:packageServer --console=plain

      - name: Headless server smoke test
        # Boots the real jar, runs 15 s of simulation with bots, and exits.
        # Fails the build if the server cannot start or crashes mid-match.
        run: |
          mkdir -p smoke && cd smoke
          unzip -o -q ../release/server.zip
          java -jar server.jar --botCount=4 --mode=TDM --selfTestSeconds=15 | tee run.log
          grep -q "MATCH START" run.log
          grep -q "server stopped" run.log

      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: release/server.zip
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            shared/build/reports/tests/
            server/build/reports/tests/

  # ---------------------------------------------------------------------------
  # Android client. Kept separate so a broken SDK never blocks the server gate.
  # ---------------------------------------------------------------------------
  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the build tools this project pins
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Same as the server job: re-assert the wrapper's exec bit so `./gradlew`
      # works regardless of the mode git stored for it (see note there).
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Generate a local signing key
        # The real key is gitignored on purpose. CI makes a throwaway one so the
        # release APK is signed and installable straight from the artifact.
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/lanfps.keystore \
            -alias lanfps -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lanfps -keypass lanfps \
            -dname "CN=LAN FPS CI, OU=CI, O=LAN FPS, L=CI, S=CI, C=LT"

      - name: Run the client unit tests
        run: ./gradlew :client-android:testDebugUnitTest --console=plain --stacktrace

      - name: Build the APKs
        run: ./gradlew :client-android:assembleDebug :client-android:assembleRelease --console=plain

      - name: Verify the release APK is signed
        run: |
          APK=$(find client-android/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --verbose "$APK"
          "$ANDROID_HOME"/build-tools/34.0.0/aapt2 dump badging "$APK" | head -5

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: client-android/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: client-android/build/reports/tests/

  # ---------------------------------------------------------------------------
  # Publish: builds are fully automated - every green push to `main` creates a
  # GitHub Release and uploads the server bundle + APKs as release assets.
  #
  # Build number == Unix epoch seconds (Linux `date +%s`). It is used as the
  # release tag, the release name and the version string written into the
  # release body, so every build is uniquely numbered by the second it was made.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [server, android]
    # Only on pushes to the default branch; PRs and other branches must not
    # create (and cannot, with a read-only GITHUB_TOKEN) releases.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Compute the Linux build number (epoch seconds)
        run: echo "BUILD_NUMBER=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download the server bundle
        uses: actions/download-artifact@v4
        with:
          name: server-bundle
          path: dist-server

      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: dist-apk

      - name: Rename artifacts with the build number
        # Tag/name carry the number, but baking it into the file names too makes
        # each release self-describing and lets several releases coexist locally.
        run: |
          set -euo pipefail
          mkdir -p dist
          cp dist-server/server.zip "dist/lanfps-server-$BUILD_NUMBER.zip"
          cp dist-apk/release/client-android-release.apk "dist/lanfps-client-release-$BUILD_NUMBER.apk"
          cp dist-apk/debug/client-android-debug.apk "dist/lanfps-client-debug-$BUILD_NUMBER.apk"

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: LAN FPS build ${{ env.BUILD_NUMBER }}
          body: |
            Automated CI build ${{ env.BUILD_NUMBER }}.

            - **Build number:** ${{ env.BUILD_NUMBER }} (Unix epoch seconds)
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}
            - **Server:** server.zip (Windows 10, JDK 17+, fire-and-forget)
            - **Client:** signed release APK (installable) + debug APK

            How to play: unzip `lanfps-server-*.zip`, run `run-server.bat`, allow
            it through the firewall, then install the APK on phones on the same
            Wi-Fi and enter the PC's IP / port 7777.
          draft: false
          prerelease: false
          files: dist/*
