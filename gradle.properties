# --- Gradle daemon / memory -------------------------------------------------
# Defaults sized for a normal desktop dev machine (>= 8 GB RAM).
# On a memory-constrained machine (<= 2 GB) use the low-memory profile instead:
#   see docs/TROUBLESHOOTING.md -> "Building on a low-memory machine"
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Kotlin compiler daemon heap
kotlin.daemon.jvmargs=-Xmx1g
kotlin.code.style=official
kotlin.incremental=true

# --- Android ----------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
